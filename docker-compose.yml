# Orquestração local do projeto.
#
#   docker compose up -d                       # interface (Open WebUI) + motor espacial (MCP)
#   docker compose --profile telemetria up -d  # idem + Langfuse (rastros)
#
# O Ollama roda fora do compose (na própria máquina ou em um servidor com GPU):
# aponte OLLAMA_URL no arquivo .env.
#
# Depois de subir: no Open WebUI, Admin > Configurações > Ferramentas Externas,
# adicione um servidor do tipo "MCP (Streamable HTTP)" com a URL
# http://mcp-python:8001/mcp. O cliente MCP nativo exige Open WebUI >= 0.6.31.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?defina WEBUI_SECRET_KEY no .env}
      - ENABLE_OLLAMA_API=True
      - OLLAMA_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    networks: [geo-net]
    depends_on: [mcp-python]
    restart: unless-stopped

  mcp-python:
    build:
      context: .
      dockerfile: mcp-python/Dockerfile
    container_name: mcp-python
    ports:
      - "8001:8001"
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - GEO_CATALOGO=/app/dados/catalogo.yaml
      - GEO_ROTEIRO=/app/conhecimento/roteiro_icmbio_2018.jsonl
      - GEO_SAIDAS=/app/resultados/mapas
      - GEO_AUDITORIA=/app/resultados/auditoria_tools.jsonl
    volumes:
      - ./dados:/app/dados:ro
      - ./conhecimento:/app/conhecimento:ro
      - ./resultados:/app/resultados
    networks: [geo-net]
    restart: unless-stopped

  # Telemetria (opcional). Langfuse 2 pede só Postgres e cabe em um notebook.
  # As versões 3 e 4 exigem também ClickHouse, Redis e armazenamento S3: para
  # elas, use o docker-compose oficial do Langfuse em vez deste perfil.
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    profiles: [telemetria]
    ports:
      - "3000:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${LANGFUSE_DB_PASSWORD:?defina LANGFUSE_DB_PASSWORD no .env}@langfuse-db:5432/postgres
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:?defina LANGFUSE_NEXTAUTH_SECRET no .env}
      - SALT=${LANGFUSE_SALT:?defina LANGFUSE_SALT no .env}
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
    networks: [geo-net]
    restart: unless-stopped

  langfuse-db:
    image: postgres:16
    container_name: langfuse-db
    profiles: [telemetria]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${LANGFUSE_DB_PASSWORD:?defina LANGFUSE_DB_PASSWORD no .env}
      - POSTGRES_DB=postgres
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    networks: [geo-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  geo-net:
    driver: bridge

volumes:
  open-webui-data:
  langfuse-db-data:
