# Orquestração local do projeto.
#
#   docker compose up -d                       # interface (Open WebUI) + motor espacial (MCP)
#
# O Ollama roda fora do compose (na própria máquina ou em um servidor com GPU):
# aponte OLLAMA_URL no arquivo .env.
#
# Depois de subir: no Open WebUI, Admin > Configurações > Ferramentas Externas,
# adicione um servidor do tipo "MCP (Streamable HTTP)" com a URL
# http://mcp-python:8001/mcp. O cliente MCP nativo exige Open WebUI >= 0.6.31.

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.6.31  # versão fixa: :main muda todo dia
    container_name: open-webui
    ports:
      - "8080:8080"
    environment:
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?defina WEBUI_SECRET_KEY no .env}
      - ENABLE_OLLAMA_API=True
      - OLLAMA_BASE_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
    networks: [geo-net]
    depends_on: [mcp-python]
    restart: unless-stopped

  mcp-python:
    build:
      context: .
      dockerfile: mcp-python/Dockerfile
    container_name: mcp-python
    ports:
      - "127.0.0.1:8001:8001"  # só esta máquina; o Open WebUI usa a rede interna geo-net
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - GEO_CATALOGO=/app/dados/catalogo.yaml
      - GEO_ROTEIRO=/app/conhecimento/roteiro_icmbio_2018.jsonl
      - GEO_SAIDAS=/app/resultados/mapas
      - GEO_AUDITORIA=/app/resultados/auditoria_tools.jsonl
    volumes:
      - ./dados:/app/dados:ro
      - ./conhecimento:/app/conhecimento:ro
      - ./resultados:/app/resultados
    networks: [geo-net]
    restart: unless-stopped

networks:
  geo-net:
    driver: bridge

volumes:
  open-webui-data:
